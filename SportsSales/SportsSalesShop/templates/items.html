<!DOCTYPE html>
<html>

    <head>
        <title> Items Page </title>
    </head>

    <body style="font-family: Arial; background:#f5f5f5;">
        <h1> This is the Items Page! </h1>

    {% for item in items %}
    <div style = "margin-bottom:20px; padding:10px; width: 30%; border:1px solid;">
        <h2> {{item.name}} </h2>
        <p> Price:  €{{item.price | floatformat:2}} </p>
        <p> {{item.description}} </p>

        <a href = "/buy/{{item.item_id}}/">
            <button>Buy Item</button>
        </a>
    </div>
    {% endfor %}
    </body>
</html>
